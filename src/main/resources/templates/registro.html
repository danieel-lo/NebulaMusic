<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Nebula Music - Registro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
</head>

<body>
<main class="auth-container">
    <section class="auth-card">

        <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">

            <div class="form-logo">
                <img src="../static/imgs/nebula-03.svg" alt="Logo Nebula">
            </div>

            <div class="form-header">
                <h3>Crear cuenta</h3>
                <p class="form-subtitle">Completa los datos para registrarte</p>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" minlength="3">
            </div>

            <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo">
            </div>

            <div class="form-group">
            <label for="contra">Contraseña</label>
            <input type="password" id="contra" name="contrasenia">
            </div>

            <div class="form-group">
            <label for="pseudonimo">Pseudonimo</label>
            <input type="text" id="pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}">
            </div>

            <div class="form-group">
            <label>Genero</label>
            <input type="radio" id="masculino" name="rad_genero" value="M">
            <label for="masculino">Masculino</label>
            <input type="radio" id="femenino" name="rad_genero" value="F">
            <label for="femenino">Femenino</label>
            <input type="radio" id="otro" name="rad_genero" value="O">
            <label for="otro">Otro</label>
            </div>

            <div class="form-group">
            <label for="suscripcion">Suscripción</label>
            <select id="suscripcion" name="sel_suscripcion">
                <option value="gratis">Gratis</option>
                <option value="mensual">Mensual</option>
                <option value="anual">Anual</option>
            </select>
            </div>

            <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento">
            </div>

            <div class="form-group">
            <input type="checkbox" id="terminos" name="chk_terminos" value="aceptado">
            <label for="terminos">Acepto los términos y condiciones</label>
            </div>

            <div class="form-group">
            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Comentarios"></textarea>
            </div>

            <div class="form-group">
            <input type="submit" value="Registrar">
            <input type="reset" value="Restablecer">
            </div>
        </form>
    </section>
</main>
</body>

</html>
